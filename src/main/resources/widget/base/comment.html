<div class="comment-item" style="border-bottom: 1px solid var(--comment-border-color, #ccc);padding-bottom: 16px;">
    <div>
        <img src="https://cn.cravatar.com/avatar/${gravatarId}?s=120" class="avatar" alt="${userNameAttribute}"/>

        <div>
            ${userIdentityHtml}

</div>
